# Gradle / JVM tuning
# 2 GB is the sweet spot for AGP 8.x: large enough to keep
# parallel module compilation snappy, small enough that
# developers on 16 GB laptops don't OOM when running an
# emulator + IDE in parallel.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX (Android 9 Pie+ removed the support library).
android.useAndroidX=true

# Kotlin code style for IDE consistency.
kotlin.code.style=official

# Non-transitive R classes — smaller R.java per module,
# faster incremental builds, recommended since AGP 8.0.
android.nonTransitiveRClass=true
